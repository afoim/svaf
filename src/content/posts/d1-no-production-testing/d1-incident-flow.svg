<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">D1 事故的配置链路与安全分支</title>
  <desc id="desc">左侧是危险的测试配置链路，右侧是静态审查和本地数据库的安全链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#edf2fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18264a" flood-opacity=".12"/></filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="m0 0 12 6-12 6z" fill="#e45c70"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="m0 0 12 6-12 6z" fill="#159d72"/></marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="90" y="92" fill="#15213e" font-family="Inter,Segoe UI,sans-serif" font-size="38" font-weight="800">一条配置，决定测试会落在哪里</text>
  <text x="90" y="138" fill="#657391" font-family="Inter,Segoe UI,sans-serif" font-size="22">真正危险的不是 DELETE 语句本身，而是它被允许看见生产库。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="205" width="640" height="445" rx="28" fill="#fff"/>
    <rect x="90" y="205" width="640" height="78" rx="28" fill="#fff0f2"/>
    <path d="M90 255h640" stroke="#f5d6da"/>
    <circle cx="132" cy="244" r="13" fill="#e45c70"/><text x="164" y="253" fill="#a6374a" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="800">事故链路</text>
    <g transform="translate(140 330)">
      <rect width="240" height="92" rx="16" fill="#fff7f8" stroke="#f0b7bf" stroke-width="2"/>
      <text x="120" y="38" text-anchor="middle" fill="#7f3140" font-family="ui-monospace,Consolas,monospace" font-size="21">test/index.spec.ts</text>
      <text x="120" y="69" text-anchor="middle" fill="#ad6170" font-family="Inter,Segoe UI,sans-serif" font-size="18">resetTestData()</text>
    </g>
    <path d="M392 376h78" stroke="#e45c70" stroke-width="5" marker-end="url(#arrow-red)"/>
    <g transform="translate(490 330)">
      <rect width="190" height="92" rx="16" fill="#fff7f8" stroke="#f0b7bf" stroke-width="2"/>
      <text x="95" y="38" text-anchor="middle" fill="#7f3140" font-family="ui-monospace,Consolas,monospace" font-size="20">vitest.config</text>
      <text x="95" y="69" text-anchor="middle" fill="#e45c70" font-family="ui-monospace,Consolas,monospace" font-size="18">production config</text>
    </g>
    <path d="M235 455v55h230v-55" fill="none" stroke="#e45c70" stroke-width="5" marker-end="url(#arrow-red)"/>
    <g transform="translate(210 530)">
      <rect width="280" height="82" rx="16" fill="#fff1f3" stroke="#e45c70" stroke-width="3"/>
      <text x="140" y="35" text-anchor="middle" fill="#a6374a" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="700">remote: true</text>
      <text x="140" y="64" text-anchor="middle" fill="#7f3140" font-family="Inter,Segoe UI,sans-serif" font-size="18">forum-db 被清空</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="870" y="205" width="640" height="445" rx="28" fill="#fff"/>
    <rect x="870" y="205" width="640" height="78" rx="28" fill="#ecfbf4"/>
    <path d="M870 255h640" stroke="#c7edda"/>
    <circle cx="912" cy="244" r="13" fill="#159d72"/><text x="944" y="253" fill="#11744f" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="800">安全契约</text>
    <g transform="translate(910 330)">
      <rect width="260" height="92" rx="16" fill="#f1fcf7" stroke="#a9dfc5" stroke-width="2"/>
      <text x="130" y="38" text-anchor="middle" fill="#176e50" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">静态代码审查</text>
      <text x="130" y="69" text-anchor="middle" fill="#4b987a" font-family="Inter,Segoe UI,sans-serif" font-size="18">diff · rg · 配置核对</text>
    </g>
    <path d="M1178 376h78" stroke="#159d72" stroke-width="5" marker-end="url(#arrow-green)"/>
    <g transform="translate(1270 330)">
      <rect width="190" height="92" rx="16" fill="#f1fcf7" stroke="#a9dfc5" stroke-width="2"/>
      <text x="95" y="38" text-anchor="middle" fill="#176e50" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="700">本地 D1</text>
      <text x="95" y="69" text-anchor="middle" fill="#4b987a" font-family="ui-monospace,Consolas,monospace" font-size="18">remote: false</text>
    </g>
    <path d="M1040 455v55h230v-55" fill="none" stroke="#159d72" stroke-width="5" marker-end="url(#arrow-green)"/>
    <g transform="translate(1015 530)">
      <rect width="280" height="82" rx="16" fill="#ecfbf4" stroke="#159d72" stroke-width="3"/>
      <text x="140" y="35" text-anchor="middle" fill="#11744f" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">小提交，可回滚</text>
      <text x="140" y="64" text-anchor="middle" fill="#398d6c" font-family="Inter,Segoe UI,sans-serif" font-size="18">不让验证动作删库</text>
    </g>
  </g>
</svg>
